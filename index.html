<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1> Banking App </h1>
  </header>

  <main>

    <div class="loginMenu">
      <label class="login_label"> account </label>
      <input type="number" class="login_account">
      <button class="login_btn"> confirm </button>
    </div>


    <div class="mainInfo">
      <div class="balance">
        <p class="balance_label"> Balance </p>
        <p class="balance_value"> 0000000 </p>
      </div>
      <div class="accountInfo">
        <p class="accountInfo_name"> account name </p>
        <p class="accountInfo_number"> account number </p>
      </div>
      <div class="income">
        <p class="income_label"> Income </p>
        <p class="income_value"> 0000 </p>
      </div>
      <div class="expenditure">
        <p class="expenditure_label"> Expenditure </p>
        <p class="expenditure_value"> 0000 </p>
      </div>
    </div>



    <div class="board">
      <div class="extract">
      </div>
      <div class="transfer"> Transfer money
        <label class="transfer_label"> account </label>
        <input type="number" class="transfer_account">
        <label class="transfer_label"> value </label>
        <input type="number" class="transfer_value">
        <button class="transfer_btn"> confirm </button>
      </div>
    </div>

  </main>

  <footer>
    <p> 2026 My Site. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
