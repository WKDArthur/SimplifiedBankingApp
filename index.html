<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banking App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1> Banking App </h1>
  </header>

  <div class="stage">

    <div class="login">
      <div class="login__box">
        <label class="login__label"> account </label>
        <input type="number" class="login__account">
        <button class="login__btn"> confirm </button>
        <button class="login__create-btn"> create account </button>
      </div>
    </div>

    <div class="create-account">
      <div class="create-account__box">
        <label class="create-account__title"> Create Account </label>
        <label class="create-account__label"> Name of the account owner</label>
        <input type="text" class="create-account__name">
        <button class="create-account__confirm-btn"> confirm </button>
        <button class="create-account__back-btn"> back </button>
      </div>
    </div>

    <main class="app">
      <div class="main-info">
        <div class="balance">
          <p class="balance__label"> Balance </p>
          <p class="balance__value"> 0000000 </p>
        </div>
        <div class="account-info">
          <p class="account-info__name"> account name </p>
          <p class="account-info__number"> account number </p>
          <button class="logout__btn"> logout </button>
        </div>
        <div class="income">
          <p class="income__label"> Income </p>
          <p class="income__value"> 0000 </p>
        </div>
        <div class="expenditure">
          <p class="expenditure__label"> Expenditure </p>
          <p class="expenditure__value"> 0000 </p>
        </div>
      </div>

      <div class=" board">
        <div class="movements">
        </div>
        <div class="operations">
          <div class="transfer"> Transfer money
            <label class="transfer__label"> account </label>
            <input type="number" class="transfer__account">
            <label class="transfer__label"> value </label>
            <input type="number" class="transfer__value">
            <button class="transfer__btn"> confirm </button>
          </div>
        </div>

      </div>
    </main>

  </div>

  <footer>
    <p> 2026 My Site. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
